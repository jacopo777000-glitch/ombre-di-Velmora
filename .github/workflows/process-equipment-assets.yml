name: Process equipment artwork
on:
  push:
    branches: [main]
    paths:
      - "process_equipment_assets.py"
      - ".github/workflows/process-equipment-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: pip install pillow numpy opencv-python-headless
      - name: Remove parchment and crop equipment
        run: python process_equipment_assets.py
      - name: Commit transparent equipment PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/equip
          git diff --cached --quiet || git commit -m "Prepare transparent cropped equipment artwork"
          git push
