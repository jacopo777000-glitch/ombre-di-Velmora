name: Prepare hand-painted battle background review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-cc0-backgrounds.yml

permissions:
  contents: read

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Download hand-painted and painterly source assets
        run: |
          mkdir -p review/individual
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/Heindals%20Collection.zip" -o /tmp/heindals.zip
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/fantasy_backgrounds.zip" -o /tmp/fantasy-forest.zip
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/background_free_valley_pack.zip" -o /tmp/valley.zip
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/meadow.jpg" -o review/individual/meadow-watercolor.jpg
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/background_43.png" -o review/individual/handpainted-ruins.png
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/speedpaint01.png" -o review/individual/broken-statue-shrine.png
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/scene01d.png" -o review/individual/tomb-concept.png
          curl -fL --retry 3 --retry-delay 2 "https://opengameart.org/sites/default/files/back_cave.png" -o review/individual/cave-dark-cc0.png
      - name: Install image tools
        run: python -m pip install --quiet Pillow
      - name: Extract and make contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageOps, ImageDraw
          import json, shutil
          root=Path("review")
          archives=[
              ("heindals", "/tmp/heindals.zip"),
              ("fantasy-forest", "/tmp/fantasy-forest.zip"),
              ("valley", "/tmp/valley.zip"),
          ]
          for folder, archive in archives:
              target=root/folder
              target.mkdir(parents=True,exist_ok=True)
              with ZipFile(archive) as z:
                  z.extractall(target)
              shutil.copy2(archive,root/(folder+"-source.zip"))
          files=[]
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".png",".jpg",".jpeg",".webp"}:
                  try:
                      im=Image.open(p)
                      if im.width>100 and im.height>100:
                          files.append((p,im.size))
                  except Exception:
                      pass
          files.sort(key=lambda x:str(x[0]).lower())
          if not files:
              raise SystemExit("No usable images found")
          cols=4; cw=360; ch=250
          rows=(len(files)+cols-1)//cols
          sheet=Image.new("RGB",(cols*cw,rows*ch),(35,32,28))
          draw=ImageDraw.Draw(sheet)
          listing=[]
          for i,(p,size) in enumerate(files):
              im=Image.open(p).convert("RGBA")
              bg=Image.new("RGBA",im.size,(80,76,68,255))
              bg.alpha_composite(im)
              thumb=ImageOps.fit(bg.convert("RGB"),(cw-12,200))
              x=(i%cols)*cw+6; y=(i//cols)*ch+6
              sheet.paste(thumb,(x,y))
              label=f"{p.relative_to(root)} | {size[0]}x{size[1]}"
              draw.text((x,y+204),label[:54],fill=(245,230,205))
              listing.append({"file":str(p),"width":size[0],"height":size[1]})
          sheet.save(root/"contact-sheet.jpg",quality=90)
          (root/"file-list.json").write_text(json.dumps(listing,indent=2))
          (root/"SOURCES.txt").write_text(
              "Heindals Collection — OpenGameArt: CC-BY-SA 3.0 (or GPL 3.0); credit Heindal_Wesnoth.\n"
              "Fantasy Forest Backdrops — OpenGameArt: CC-BY-SA 4.0; credit Brett Post Script.\n"
              "Free Valley Background — OpenGameArt: CC-BY 4.0; credit LudicArts.\n"
              "Meadow background — OpenGameArt: CC0; author bart.\n"
              "Background with ruins — OpenGameArt: CC0; author Kutejnikov.\n"
          )
          print(f"Found {len(files)} images")
          for item in listing: print(item)
          PY
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: hand-painted-background-review
          path: review/
          retention-days: 7
